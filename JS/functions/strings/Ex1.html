<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strings</title>
  </head>
  <body>
    <h1>welcome to world of Strings</h1>
    <h2>useful methods in Strings</h2>
    <script>
      let str1 = "hello world";
      let str2 = "world";
      console.log(str1.length); // returns the length of the string
      console.log(str1.toUpperCase()); // converts the string to uppercase
      console.log(str1.toLowerCase()); // converts the string to lowercase
      console.log(str1.indexOf("world")); // returns the index of the first occurrence of "world"
      if (str1.includes(str2)) {
        console.log("The string contains the word 'world'.");
      } else {
        console.log("The string does not contain the word 'world'.");
      }
        console.log(str1.replace("world", "JavaScript")); // replaces "world" with "JavaScript"
        console.log(str1.split(" ")); // splits the string into an array of words
        console.log(str1.indexOf[0]); // returns the index of the first character
        console.log(str1.length-1); // returns the index of the last character
        console.log(str1.slice(0, 5)); // extracts a part of the string from index 0 to 5
        console.log(str1.indexOf(" ")); // returns the index of the first space character
        const result = str1.replace(str1.indexOf[2,5], "JavaScript"); // replaces characters from index 2 to 5 with "JavaScript"
    </script>
  </body>
</html>
